<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf7ec" />
  <title>Angry Sketches · controller</title>
  <link rel="stylesheet" href="/src/controller/controller.css" />
</head>
<body>
  <header id="bar">
    <span id="who"></span>
    <span id="status">connecting…</span>
  </header>

  <!-- join form, shown when there is no ?room= -->
  <section id="join" class="screen" hidden>
    <h1>Angry Sketches</h1>
    <label>Room code <input id="joinRoom" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" /></label>
    <label>Your name <input id="joinName" maxlength="20" autocomplete="nickname" placeholder="Sam" /></label>
    <button id="joinBtn" class="big">Join</button>
  </section>

  <section id="msg" class="screen" hidden>
    <h1 id="msgTitle"></h1>
    <p id="msgText"></p>
    <ul id="legend" hidden>
      <li><i style="background:#1d1d1d"></i>black marker = wood</li>
      <li><i style="background:#2f6fd6"></i>blue = ice</li>
      <li><i style="background:#9a9a9a"></i>pencil / grey = stone</li>
      <li><i style="background:#d8322b"></i>red = TNT</li>
      <li><i style="background:#3aa548"></i>green blobs = pigs</li>
      <li class="tip">iPad tips: thick pen, filled-in shapes, clearly blue and clearly green (no teal), dark grey for stone.</li>
    </ul>
    <div id="scores" hidden></div>
    <label id="scanLabel" class="big button" hidden>
      📷 Scan fort
      <input id="scanInput" type="file" accept="image/*" capture="environment" hidden />
    </label>
    <!-- no capture attribute: lets iPhone/iPad pick a saved drawing from Photos or Files -->
    <label id="uploadLabel" class="big button" hidden>
      🖼 Upload drawing
      <input id="uploadInput" type="file" accept="image/*" hidden />
    </label>
    <button id="nextBtn" class="big" hidden></button>
  </section>

  <section id="fling" class="screen" hidden>
    <p id="flingHint">Drag back from the centre, let go to fling!</p>
    <canvas id="pad"></canvas>
    <canvas id="motionPad" hidden></canvas>
    <div class="row">
      <button id="motionBtn" class="big" hidden>🎯 Enable motion</button>
      <button id="modeBtn" class="small" hidden>Use drag instead</button>
    </div>
    <div id="flash" hidden></div>
  </section>

  <script type="module" src="/src/controller/main.js"></script>
</body>
</html>
