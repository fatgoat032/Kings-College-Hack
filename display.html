<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angry Sketches · display</title>
  <link rel="stylesheet" href="/src/display/display.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- top bar: phase, scores, small join code -->
  <header id="hud" hidden>
    <div class="team A"><b>Team A</b> <span id="scoreA">0</span></div>
    <div id="phaseText"></div>
    <div class="team B"><span id="scoreB">0</span> <b>Team B</b></div>
    <div id="mini"><canvas id="miniQr"></canvas><span id="miniCode"></span></div>
  </header>

  <!-- lobby: big code + QR -->
  <section id="lobby" class="overlay" hidden>
    <h1>Angry Sketches</h1>
    <div class="join">
      <canvas id="qr"></canvas>
      <div>
        <p>Scan to join, or open</p>
        <p id="joinUrl"></p>
        <p>and enter code</p>
        <div id="code"></div>
      </div>
    </div>
    <div class="rosters">
      <ul id="rosterA" class="A"></ul>
      <ul id="rosterB" class="B"></ul>
    </div>
    <button id="startBtn">Start game</button>
  </section>

  <!-- centre card for draw / scan / result / errors -->
  <section id="card" class="overlay card" hidden>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <div id="cardButtons"></div>
  </section>

  <pre id="log" hidden></pre>
  <script type="module" src="/src/display/main.js"></script>
</body>
</html>
