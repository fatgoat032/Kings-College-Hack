<!doctype html>
<meta charset="utf-8">
<title>auto-pick check (simulated Claude)</title>
<body style="font:13px system-ui;margin:12px">
<h3>parseFort auto-pick with SIMULATED /api/classify and /api/layout</h3>
<pre id="o">running…</pre>
<script type="module">
  // Simulated server: real Claude only runs on the demo laptop (the only machine with the key).
  const realFetch = window.fetch.bind(window);
  let scenario = 'good';
  window.fetch = async (url, opts) => {
    const u = String(url);
    const json = (o) => new Response(JSON.stringify(o), { headers: { 'content-type': 'application/json' } });
    if (u.endsWith('/api/claude/status')) return json({ enabled: scenario !== 'nokey', model: 'simulated' });
    if (u.endsWith('/api/classify')) {
      if (scenario === 'down') return json({ error: 'simulated outage' });
      const conf = scenario === 'unsure' ? 0.55 : 0.92;
      return json({ shapes: truth.map((t) => ({ ...t, confidence: conf })) });
    }
    if (u.endsWith('/api/layout')) {
      if (scenario === 'down') return json({ error: 'simulated outage' });
      // a plausible Claude layout in page fractions: 2 pillars, beam, TNT, 2 pigs
      return json({ blocks: [
        { colour: 'black', x: 0.28, y: 0.84, w: 0.02, h: 0.25, angle: 0.05 },
        { colour: 'black', x: 0.53, y: 0.84, w: 0.02, h: 0.25, angle: 0 },
        { colour: 'blue', x: 0.41, y: 0.69, w: 0.3, h: 0.05, angle: 0.1 },
        { colour: 'red', x: 0.41, y: 0.6, w: 0.07, h: 0.09, angle: 0 },
        { colour: 'grey', x: 0.78, y: 0.86, w: 0.07, h: 0.25, angle: 0 },
      ], pigs: [{ x: 0.41, y: 0.9, r: 0.03 }, { x: 0.78, y: 0.55, r: 0.03 }] });
    }
    return realFetch(url, opts);
  };
  const { parseFort, findShapesByColour, ready } = await import('/src/vision/index.js');
  const { loadCv } = await import('/src/vision/opencv.js');
  const { toImageData } = await import('/src/vision/parseFort.js');
  const { loadSettings } = await import('/src/vision/settings.js');
  await ready();
  // what a correct Claude would answer: each numbered shape's true colour
  const truth = findShapesByColour(await loadCv(), await toImageData('./ipad-marker-pencil.svg'), loadSettings()).shapes
    .map((s) => ({ n: s.n, colour: s.guess, kind: s.guess === 'green' ? 'pig' : 'block' }));
  const out = [];
  // classify keeps our own colour guess when Claude says colour undefined -> use guesses via low conf? no: set colour from guess
  for (const sc of ['good', 'unsure', 'down', 'nokey']) {
    scenario = sc;
    // reset the status cache between scenarios by reloading the module state is not possible; status cached 60 s,
    // so 'nokey' is checked last in a fresh import below.
    if (sc === 'nokey') break;
    const r = await parseFort('./ipad-marker-pencil.svg');
    const c = r.candidates;
    out.push(`${sc.padEnd(6)} -> chose ${r.pick.chose.padEnd(6)} (${r.pick.reason}) · meta.detector ${r.level.meta.detector} · blocks ${r.level.blocks.length}, pigs ${r.level.pigs.length} · candidates: ${Object.entries(c).map(([k, v]) => `${k}:${v.ok ? 'ok' : 'fail'}${v.avgConfidence !== undefined ? `@${v.avgConfidence}` : ''}`).join(' ')}`);
  }
  document.getElementById('o').textContent = out.join('\n');
</script>
