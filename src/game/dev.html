<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angry Sketches · game dev page</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8e1d0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #help {
      position: fixed; left: 12px; bottom: 10px; font: 13px system-ui, sans-serif;
      color: #2b2622; background: rgba(251, 247, 236, 0.85); padding: 6px 10px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <!-- dev keys (hidden): drag the slingshot, arrows + space, 1/2/3 forts, 0 empty, P photo reveal, W winner, T summary, M mute -->
  <script type="module">
    import { createGame } from './index.js';

    const game = createGame(document.getElementById('game'));
    window.game = game;
    const levels = game.sampleLevels;
    game.on('shotDone', (d) => console.log('shotDone', d));
    game.on('levelError', (d) => console.warn('levelError', d.errors));
    game.setTeam('A');
    game.loadLevel(levels[0]);

    window.addEventListener('keydown', async (e) => {
      if (e.key >= '1' && e.key <= String(levels.length)) game.loadLevel(levels[+e.key - 1]);
      if (e.key === '0') game.reset();
      if (e.key === 't' || e.key === 'T') game.showTurnSummary({ team: 'A', blobs: game.getState().knocked, birds: game.getState().birdsUsed });
      if (e.key === 'w' || e.key === 'W') game.showWinner({ winner: 'A', blobs: { A: 5, B: 3 }, birds: { A: 3, B: 3 } }, () => game.loadLevel(levels[0]));
      if (e.key === 'p' || e.key === 'P') {
        // photo reveal using a vision fixture
        const { parseFort, ready } = await import('../vision/parseFort.js');
        if (ready) await ready();
        const img = new Image();
        img.src = '/fixtures/synthetic-flat.svg';
        await img.decode();
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || 1280; c.height = img.naturalHeight || 900;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const res = await parseFort(img);
        game.loadLevel(res.level, { photo: c.toDataURL('image/jpeg', 0.85), page: res.page });
      }
    });
  </script>
</body>
</html>
